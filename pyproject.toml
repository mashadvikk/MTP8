[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mashadvikk-calc"
version = "0.1.0"
description = "Expression calculator built with TDD and MVC"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Maria Dvikalyuk" }]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "flake8>=7", "httpx>=0.27", "build>=1.2", "twine>=6"]

[project.scripts]
mvc-calc = "mvc_calc.__main__:main"

[tool.setuptools]
packages = ["mvc_calc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
